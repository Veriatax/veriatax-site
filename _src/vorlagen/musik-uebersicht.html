<head>

    <style>
        /* gemeinsam:schriften */
        /* /gemeinsam:schriften */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #06080f; --accent: #f0a030; --accent-cyan: #00d4ff; --accent-magenta: #ff3090;
            --text: #eef2f7; --text-dim: rgba(238,242,247,0.6); --text-muted: rgba(238,242,247,0.5);
            --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.07);
        }
        body {
            font-family: 'Exo 2', sans-serif; background: var(--bg); color: var(--text);
            line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        a { color: #f0a030; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .ambient .orb {
            position: absolute; border-radius: 50%; filter: blur(120px);
            animation: drift 20s ease-in-out infinite;
        }
        .ambient .orb-1 { width: 400px; height: 400px; background: rgba(240,160,48,0.06); top: -5%; left: 5%; }
        .ambient .orb-2 { width: 350px; height: 350px; background: rgba(255,48,144,0.04); bottom: 0; right: 5%; animation-delay: -8s; }
        @keyframes drift {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(30px,-20px); }
        }

        .page { max-width: 800px; margin: 0 auto; padding: 48px 24px 100px; }
        .track-layout { display: flex; gap: 32px; align-items: flex-start; margin-bottom: 40px; }
        .track-cover {
            width: 280px; height: 280px; flex-shrink: 0;
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 60px rgba(240,160,48,0.08);
        }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; }
        .track-info { flex: 1; padding-top: 8px; }
        .track-label {
            font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
            background: linear-gradient(135deg, #f0a030, #ff3090);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 6px; display: block;
        }
        .track-title {
            font-family: 'Rajdhani', sans-serif; font-size: clamp(28px, 4vw, 40px);
            font-weight: 800; margin-bottom: 4px; line-height: 1.1;
        }
        .track-genre { font-size: 15px; color: var(--accent-cyan); margin-bottom: 16px; }
        .track-desc { font-size: 15px; color: var(--text-dim); line-height: 1.7; margin-bottom: 20px; }
        .track-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }

        .listen-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-spotify, .btn-apple {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 24px; color: #fff;
            font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 600;
            border-radius: 10px; text-decoration: none; transition: all 0.3s ease;
        }
        .btn-spotify { background: #1db954; color: #000; }
        .btn-spotify:hover {
            background: #1ed760; transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(29,185,84,0.3); text-decoration: none;
        }
        .btn-apple { background: linear-gradient(135deg, #fb5c74, #fa233b); }
        .btn-apple:hover {
            background: linear-gradient(135deg, #fc7183, #fb3a50); transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(250,35,59,0.3); text-decoration: none;
        }
        .btn-presave {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 13px 28px; color: #0a0a0a;
            background: linear-gradient(135deg, #f0a030, #ff6a00, #ff3090);
            font-family: 'Exo 2', sans-serif; font-size: 14px; font-weight: 700;
            border-radius: 10px; text-decoration: none; transition: all 0.3s ease;
        }
        .btn-presave:hover {
            transform: translateY(-2px); box-shadow: 0 8px 30px rgba(240,160,48,0.32);
            text-decoration: none;
        }
        .presave-note {
            font-size: 12px; color: var(--text-muted); margin-top: 12px; max-width: 380px;
        }
        .follow-line {
            margin-top: 22px; padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .follow-line > span { font-size: 13px; color: var(--text-muted); }
        .btn-follow {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border-radius: 8px;
            background: rgba(29,185,84,0.08); border: 1px solid rgba(29,185,84,0.3);
            color: #1db954; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all 0.3s ease;
        }
        .btn-follow:hover {
            background: rgba(29,185,84,0.14); border-color: rgba(29,185,84,0.5);
            transform: translateY(-1px); text-decoration: none;
        }

        .coming-badge {
            display: inline-block; padding: 8px 20px; border-radius: 8px;
            background: rgba(240,160,48,0.1); border: 1px solid rgba(240,160,48,0.2);
            color: var(--accent); font-size: 14px; font-weight: 600;
        }

        .more-section { margin-top: 60px; }
        .more-section h2 {
            font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 600;
            margin-bottom: 16px; color: var(--text-dim);
        }
        .more-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .more-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px; border-radius: 10px;
            background: var(--glass); border: 1px solid var(--border);
            text-decoration: none; color: var(--text); transition: all 0.3s ease;
        }
        .more-item:hover {
            border-color: rgba(240,160,48,0.12); transform: translateY(-2px);
            text-decoration: none;
        }
        .more-item img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        .more-item span { font-size: 13px; font-weight: 500; }

        @media (max-width: 640px) {
            .track-layout { flex-direction: column; align-items: center; text-align: center; }
            .track-cover { width: 220px; height: 220px; }
            .listen-buttons { justify-content: center; }
            .btn-spotify, .btn-apple, .btn-presave { width: 100%; justify-content: center; }
            .follow-line { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-follow { justify-content: center; }
            .presave-note { margin-left: auto; margin-right: auto; }
        }

        .navbar {
            position: sticky; top: 0; z-index: 100; padding: 0 24px;
            background: rgba(6,8,15,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; height: 72px;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { width: 38px; height: 38px; object-fit: contain; border-radius: 6px; }
        .logo-text {
            font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 3px;
            background: linear-gradient(135deg, #f0a030, #ff3090);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-links { display: flex; gap: 32px; align-items: center; }
        .nav-link {
            font-size: 14px; font-weight: 400; color: rgba(238,242,247,0.5);
            letter-spacing: 0.5px; transition: color 0.3s ease; text-decoration: none; position: relative;
        }
        .nav-link:hover { color: #f0a030; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px;
            background: linear-gradient(135deg, #f0a030, #ff6a00); transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        .lang-toggle {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: rgba(238,242,247,0.5); font-family: 'Rajdhani', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 5px 12px;
            border-radius: 6px; cursor: pointer; transition: all 0.3s ease;
        }
        .lang-toggle:hover { color: #f0a030; background: rgba(240,160,48,0.08); border-color: rgba(240,160,48,0.2); }
        .nav-toggle {
            display: none; flex-direction: column; gap: 5px;
            background: none; border: none; cursor: pointer; padding: 4px;
        }
        .nav-toggle span { width: 24px; height: 2px; background: #eef2f7; border-radius: 2px; transition: 0.3s ease; }
        @media (max-width: 640px) {
            .nav-links {
                display: none; position: absolute; top: 72px; left: 0; right: 0;
                background: rgba(6,8,15,0.97); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                flex-direction: column; padding: 16px 24px; gap: 0;
                border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 999;
            }
            .nav-links.open { display: flex; }
            .nav-toggle { display: flex; }
            .nav-link { padding: 14px 0; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
            .nav-link::after { display: none; }
            .lang-toggle { align-self: flex-start; margin: 12px 0 4px 0; padding: 8px 20px; font-size: 12px; }
        }
        /* Musik-Uebersicht */
        .music-head { text-align: center; max-width: 620px; margin: 0 auto; }
        .music-head .track-desc { margin-bottom: 0; }
        .release-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; margin-top: 40px; }
        .release-card {
            display: flex; flex-direction: column; gap: 3px; padding: 10px 10px 14px;
            border-radius: 14px; background: var(--glass); border: 1px solid var(--border);
            color: var(--text); text-decoration: none; transition: all 0.3s ease;
        }
        .release-card:hover { border-color: rgba(240,160,48,0.25); transform: translateY(-3px); text-decoration: none; }
        .release-card img { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin-bottom: 9px; }
        .release-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.2; }
        .release-genre { font-size: 12px; color: var(--accent-cyan); line-height: 1.4; }
        .release-date { font-size: 12px; color: var(--text-muted); }
        .artist-follow { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 44px; }
        @media (max-width: 640px) {
            .release-grid { grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
            .release-title { font-size: 15px; }
            .artist-follow .btn-spotify, .artist-follow .btn-apple { width: 100%; justify-content: center; }
        }
        /* gemeinsam:sprunglink-css */
        /* /gemeinsam:sprunglink-css */
        /* gemeinsam:fusszeile-css */

        /* gemeinsam:menue-css */
        /* /gemeinsam:menue-css */
    </style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="skip">Skip to content</a>

<div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<!-- gemeinsam:navigation -->
<!-- /gemeinsam:navigation -->
<main id="main" tabindex="-1">

<div class="page">
    <div class="music-head">
        <span class="track-label" data-i18n="label">Discography</span>
        <h1 class="track-title" data-i18n="title">Music</h1>
        <p class="track-desc" data-i18n="intro">{{INTRO_EN}}</p>
    </div>
    <div class="release-grid">
{{KARTEN}}
    </div>
    <div class="artist-follow">
        <a href="https://open.spotify.com/artist/7hwHYyhlmqEi4v1PnidxcT" target="_blank" rel="noopener" class="btn-spotify">
            {{ICON_SPOTIFY}}
            <span data-i18n="follow.spotify">Follow on Spotify</span>
        </a>
        <a href="https://music.apple.com/de/artist/veriatax-interactive/1875692825" target="_blank" rel="noopener" class="btn-apple">
            {{ICON_APPLE}}
            <span data-i18n="follow.apple">Follow on Apple Music</span>
        </a>
    </div>
</div>

</main>
<!-- gemeinsam:fusszeile -->
<!-- /gemeinsam:fusszeile -->

<!-- gemeinsam:statistik -->
<!-- /gemeinsam:statistik -->
<script>
/* gemeinsam:texte */
/* /gemeinsam:texte */
const pageTrans = {
    de: {
        ...COMMON_TRANS.de,
        "label": "Diskografie",
        "title": "Musik",
        "intro": "{{JS_INTRO_DE}}",
        "follow.spotify": "Auf Spotify folgen",
        "follow.apple": "Auf Apple Music folgen",
{{JS_KARTEN_DE}}
    },
    en: {
        ...COMMON_TRANS.en,
        "label": "Discography",
        "title": "Music",
        "intro": "{{JS_INTRO_EN}}",
        "follow.spotify": "Follow on Spotify",
        "follow.apple": "Follow on Apple Music",
{{JS_KARTEN_EN}}
    }
};
let currentLang = 'en';
function initLang() {
    try {
        const s = localStorage.getItem('veriatax-lang');
        if (s === 'de' || s === 'en') currentLang = s;
        else currentLang = (navigator.language || '').startsWith('de') ? 'de' : 'en';
    } catch(e) { currentLang = 'en'; }
    applyLang(currentLang);
}
function toggleLang() {
    currentLang = currentLang === 'en' ? 'de' : 'en';
    applyLang(currentLang);
    try { localStorage.setItem('veriatax-lang', currentLang); } catch(e) {}
}
function applyLang(lang) {
    const d = pageTrans[lang]; if (!d) return;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (d[k]) el.textContent = d[k];
    });
    const btn = document.getElementById('langToggle');
    if (btn) btn.textContent = lang === 'en' ? 'DE' : 'EN';
    document.documentElement.lang = lang;
}
const navToggle = document.getElementById('navToggle');
const navLinks = document.getElementById('navLinks');
if (navToggle) {
    navToggle.addEventListener('click', () => {
        const open = navLinks.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', open);
    });
    navLinks.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', () => {
        navLinks.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
    }));
}
document.addEventListener('DOMContentLoaded', initLang);
</script>
</body>
</html>
